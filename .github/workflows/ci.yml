name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # GitHub-hosted, not self-hosted: this repo is public, so a fork PR must not run on our hosts.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

