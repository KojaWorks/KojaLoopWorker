name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # GitHub-hosted, not self-hosted: this repo is public, so a fork PR must not run on our hosts.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  python:
    # The Python reference implementation, until the Swift cutover deletes it.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest pytests/ -q
