# On a v* tag: builds a universal loopworker, signs it with the Developer ID certificate,
# notarizes it, publishes it as a GitHub release, and points the Homebrew tap's formula at it.
# Run by hand (workflow_dispatch) it builds, signs and notarizes the current commit and publishes
# nothing. packaging/homebrew/README.md documents the secrets.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      tarball: ${{ steps.package.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dispatch"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          printf '// Written by the release workflow.\npublic let loopworkerVersion = "%s"\n' "$version" > Sources/LoopWorkerCore/Version.swift

      - name: Test
        run: swift test

      - name: Build
        run: |
          set -euo pipefail
          version="$VERSION"
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          stage="loopworker-$version"
          mkdir -p "$stage/licenses"
          cp "$bin/loopworker" "$stage/"
          if [ -f LICENSE ]; then cp LICENSE "$stage/licenses/LoopWorker"; fi
          cp .build/checkouts/swift-argument-parser/LICENSE.txt "$stage/licenses/swift-argument-parser"
          cp .build/checkouts/TOMLDecoder/LICENSE.md "$stage/licenses/TOMLDecoder"
          lipo -archs "$stage/loopworker" | grep -q x86_64
          lipo -archs "$stage/loopworker" | grep -q arm64
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      # Gatekeeper kills an unsigned or un-notarized binary on hosts where nobody can answer its
      # first-launch prompt (a LaunchDaemon, an SSH-only user).
      - name: Set up a throwaway signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${CERT_P12_BASE64:-}" ] || { echo "::error::secret MACOS_CERT_P12_BASE64 is not set (a Developer ID Application certificate as base64 .p12)"; exit 1; }
          kc="$RUNNER_TEMP/loopworker-signing.keychain-db"
          kc_pw="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert"
          security list-keychains -d user | sed 's/[" ]//g' > "$RUNNER_TEMP/orig-keychains.txt"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$cert" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(cat "$RUNNER_TEMP/orig-keychains.txt")
          rm -f "$cert"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12_BASE64"; exit 1; }
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign and notarize
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!v:-}" ] || { echo "::error::secret for $v is not set (an App Store Connect API key for notarytool)"; exit 1; }
          done
          codesign --force --timestamp --options runtime --keychain "$SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" "$STAGE/loopworker"
          codesign --verify --strict --verbose=2 "$STAGE/loopworker"
          codesign -dvv "$STAGE/loopworker" 2>&1 | grep -E "^Authority=Developer ID Application|^Timestamp|flags=.*runtime"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"
          zip="$RUNNER_TEMP/loopworker-notarize.zip"
          /usr/bin/ditto -c -k --keepParent "$STAGE/loopworker" "$zip"
          # A bare binary can't be stapled; Gatekeeper looks the ticket up online.
          result="$(xcrun notarytool submit "$zip" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --output-format json)"
          echo "$result"
          id="$(printf '%s' "$result" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          status="$(printf '%s' "$result" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            echo "::error::notarization $status for submission $id"
            exit 1
          fi
          rm -f "$key" "$zip"

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/orig-keychains.txt")
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="$VERSION"
          stage="$STAGE"
          [ "$("$stage/loopworker" --version)" = "$version" ]
          tarball="loopworker-$version-macos-universal.tar.gz"
          tar -czf "$tarball" "$stage"
          {
            echo "version=$version"
            echo "tarball=$tarball"
            echo "sha256=$(shasum -a 256 "$tarball" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          git log --format='- %s' "$previous..$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "$GITHUB_REF_NAME" --notes-file notes.md

  tap:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Require TAP_TOKEN
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::The TAP_TOKEN secret is missing. Add a token with Contents read and write on nevyn/homebrew-tap as this repository's TAP_TOKEN secret, then re-run this job. The release itself is published."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: loopworker

      - uses: actions/checkout@v4
        with:
          repository: nevyn/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Update Formula/loopworker.rb
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -eu
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$TARBALL"
          mkdir -p tap/Formula
          sed -e "s|^  url \".*\"$|  url \"$url\"|" \
              -e "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" \
              loopworker/packaging/homebrew/loopworker.rb > tap/Formula/loopworker.rb
          grep -qF "url \"$url\"" tap/Formula/loopworker.rb || { echo "url line not rewritten in Formula/loopworker.rb" >&2; exit 1; }
          grep -qF "sha256 \"$SHA256\"" tap/Formula/loopworker.rb || { echo "sha256 line not rewritten in Formula/loopworker.rb" >&2; exit 1; }
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/loopworker.rb
          if git diff --cached --quiet; then
            echo "Formula/loopworker.rb already points at $VERSION"
            exit 0
          fi
          git commit -m "loopworker $VERSION"
          git push
