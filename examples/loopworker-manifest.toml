# Copy to <your-project>/.loopworker/manifest.toml, or to a host-local contract overlay.
# Every key is optional; the values below are the defaults. See docs/project-contract.md.

[scripts]
provision = "provision.sh"        # heavy, idempotent: brings a slot's stack up
reset     = "reset.sh"            # cheap reset before each card on a hot slot
verify    = "verify.sh"           # the gate: nonzero exit means the worker isn't done
teardown  = "teardown.sh"         # best effort: stops the stack
provision_timeout_minutes = 45    # a hung script's process group is killed at its timeout
reset_timeout_minutes     = 15
teardown_timeout_minutes  = 10

[worker]
branch = "loopworker-{number}-{slug}"
wallclock_cap_minutes = 90
# mcp_config = "mcp.json"         # MCP servers for the worker; unset means none

[review]
guide = false                     # ask for a storygrafter review guide
